<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Parking Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>🚗 Smart Parking</h2>
            <p class="backend"></p>

            <button onclick="showSection('dashboard')">
                🏠 Dashboard
            </button>

            <button onclick="showSection('park')">
                🚘 Park Vehicle
            </button>

            <button onclick="showSection('remove')">
                🚪 Remove Vehicle
            </button>

            <button onclick="showSection('search')">
                🔍 Search Vehicle
            </button>

            <button onclick="showSection('slots')">
                🅿️ View Slots
            </button>

        </aside>


        <!-- Main Content -->
        <main class="main">

            <header>
                <h1>Smart Parking Management System</h1>
                <p>Manage your parking easily</p>
            </header>


            <!-- Dashboard -->
            <section id="dashboard" class="section">

                <div class="cards">

                    <div class="card">
                        <h3>Total Slots</h3>
                        <h1 id="totalSlots">10</h1>
                    </div>

                    <div class="card">
                        <h3>Occupied</h3>
                        <h1 id="occupiedSlots">0</h1>
                    </div>

                    <div class="card">
                        <h3>Available</h3>
                        <h1 id="availableSlots">10</h1>
                    </div>

                    <div class="card">
                        <h3>Revenue</h3>
                        <h1>₹<span id="revenue">0</span></h1>
                    </div>

                </div>


                <div class="panel">

                    <h2>Parking Slots</h2>

                    <div id="slotContainer" class="slot-container"></div>

                </div>

            </section>


            <!-- Park Vehicle -->
            <section id="park" class="section hidden">

                <div class="form-box">

                    <h2>🚘 Park Vehicle</h2>

                    <input
                        type="text"
                        id="vehicleNumber"
                        placeholder="Vehicle Number e.g. PB10AB1234"
                    >

                    <select id="vehicleType">
                        <option value="Car">Car</option>
                        <option value="Bike">Bike</option>
                    </select>

                    <button onclick="parkVehicle()">
                        Park Vehicle
                    </button>

                    <p id="parkMessage"></p>

                </div>

            </section>


            <!-- Remove Vehicle -->
            <section id="remove" class="section hidden">

                <div class="form-box">

                    <h2>🚪 Remove Vehicle</h2>

                    <input
                        type="text"
                        id="removeNumber"
                        placeholder="Enter Vehicle Number"
                    >

                    <input
                        type="number"
                        id="hours"
                        placeholder="Parking Hours"
                        min="1"
                    >

                    <button onclick="removeVehicle()">
                        Remove Vehicle
                    </button>

                    <p id="removeMessage"></p>

                </div>

            </section>


            <!-- Search Vehicle -->
            <section id="search" class="section hidden">

                <div class="form-box">

                    <h2>🔍 Search Vehicle</h2>

                    <input
                        type="text"
                        id="searchNumber"
                        placeholder="Enter Vehicle Number"
                    >

                    <button onclick="searchVehicle()">
                        Search
                    </button>

                    <div id="searchResult"></div>

                </div>

            </section>


            <!-- Slots -->
            <section id="slots" class="section hidden">

                <div class="panel">

                    <h2>🅿️ All Parking Slots</h2>

                    <div id="allSlots" class="slot-container"></div>

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
